name: Update Appcast

# Sparkle can only use an update once its download URL is public, so the feed is
# updated when the release is published rather than when it is built. That is also
# what keeps the appcast from ever advertising a draft (whose asset URLs 404).
#
# The feed also carries delta updates: the last few release DMGs are fetched as
# diff bases, and the .delta files that produces are uploaded to this release
# before the feed is committed. See docs/adr/0052-delta-updates.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign into the feed (default: latest published release)"
        required: false
        type: string
      include_prerelease:
        description: "Allow a prerelease into the stable feed"
        type: boolean
        default: false

concurrency:
  group: appcast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  appcast:
    name: Sign and publish the feed
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Which release is published, which asset is signed and which archives are
      # diffed live in Scripts/appcast-release.sh: the job downloads what it
      # selects, and --dry-run prints the same plan locally without downloading.
      - name: Resolve the release to publish and its delta bases
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INCLUDE_PRERELEASE: ${{ inputs.include_prerelease }}
        run: |
          set -euo pipefail

          ARGS=(--repo "$GITHUB_REPOSITORY" --download-dir "$RUNNER_TEMP" --github-output)
          if [ -n "$RELEASE_TAG" ]; then
            ARGS+=(--tag "$RELEASE_TAG")
          elif [ -n "$INPUT_TAG" ]; then
            ARGS+=(--tag "$INPUT_TAG")
          fi
          if [ "$INCLUDE_PRERELEASE" = "true" ]; then
            ARGS+=(--allow-prerelease)
          fi

          Scripts/appcast-release.sh ${ARGS[@]+"${ARGS[@]}"}

      - name: Make Sparkle's tools available
        if: steps.release.outputs.skip != 'true'
        run: |
          set -uo pipefail
          # Sparkle's command line tools are binary artifacts of the SwiftPM
          # package, so resolving fetches them. A build is the fallback for
          # layouts that only materialise them during compilation.
          swift package resolve
          if ! Scripts/generate-appcast.sh --check >/dev/null; then
            echo "generate_appcast is missing after resolve; building the package."
            swift build -c release --arch "$(uname -m)"
          fi
          Scripts/generate-appcast.sh --check

      - name: Regenerate and verify the feed
        if: steps.release.outputs.skip != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            # generate_appcast would otherwise fall back to the keychain, find no
            # key on a clean runner, and write an unsigned item that every
            # installed copy rejects.
            echo "::error::SPARKLE_PRIVATE_KEY is not set. The feed would be published without a signature."
            exit 1
          fi

          PREVIOUS_ARGS=()
          for ARCHIVE in "$RUNNER_TEMP"/previous/*.dmg; do
            [ -e "$ARCHIVE" ] || continue
            PREVIOUS_ARGS+=(--previous-dmg "$ARCHIVE")
          done

          # The feed already in the repository is the base, so existing items keep
          # their signatures and history is never rewritten. The deltas land in
          # $RUNNER_TEMP/deltas for the upload step; the script fails if a delta
          # enclosure it wrote is unsigned, missing or points at another release.
          Scripts/generate-appcast.sh \
            --tag "$TAG" \
            --dmg "$RUNNER_TEMP/release/$ASSET" \
            --delta-dir "$RUNNER_TEMP/deltas" \
            --repo "$GITHUB_REPOSITORY" \
            ${PREVIOUS_ARGS[@]+"${PREVIOUS_ARGS[@]}"}

      - name: Upload the delta updates
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DELTAS=("$RUNNER_TEMP"/deltas/*.delta)
          if [ ${#DELTAS[@]} -eq 0 ]; then
            echo "No deltas were generated; the feed advertises the full archive only."
            exit 0
          fi

          # Before the feed is committed: an advertised delta that has not been
          # uploaded yet is a 404 that every updating copy has to fall back from.
          gh release upload "$TAG" "${DELTAS[@]}" --clobber
          echo "Uploaded ${#DELTAS[@]} delta(s) to $TAG."

      - name: Commit the feed
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # version.env is regenerated alongside the feed by generate-appcast.sh so a
          # local build does not sit below the released version and nag for an update.
          if git diff --quiet -- appcast.xml version.env; then
            echo "appcast.xml and version.env already reflect $TAG; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml version.env
          git commit -m "Update appcast and version.env to $TAG"

          # Another push to the default branch can land while this job runs.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "Pushed appcast.xml to $DEFAULT_BRANCH."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/$DEFAULT_BRANCH and retrying."
            git pull --rebase origin "$DEFAULT_BRANCH"
          done

          echo "::error::Could not push appcast.xml after 3 attempts."
          exit 1
